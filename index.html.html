<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Control Hub - Seguro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #080c14;
      background-image: radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.15), transparent 70%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* TELA DE LOGIN */
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 12, 20, 0.95);
      backdrop-filter: blur(15px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .login-card {
      width: 100%;
      max-width: 340px;
      background: rgba(18, 24, 38, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .login-card h2 {
      font-size: 1.6rem;
      color: #38bdf8;
      margin-bottom: 8px;
    }

    .login-card p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .input-field {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(15, 23, 42, 0.8);
      color: #fff;
      font-size: 1rem;
      text-align: center;
      margin-bottom: 16px;
      outline: none;
      letter-spacing: 2px;
    }

    .input-field:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    /* PAINEL PRINCIPAL */
    .container {
      width: 100%;
      max-width: 380px;
      background: rgba(18, 24, 38, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      text-align: center;
      position: relative;
    }

    header h1 {
      font-size: 2.8rem;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 2px;
    }

    header p {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-top: 4px;
      margin-bottom: 24px;
    }

    .status-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .led-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      background: #0f172a;
      border: 3px solid #334155;
    }

    .led-core {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #334155;
      transition: all 0.3s ease;
    }

    .led-ring.on {
      border-color: #00ff88;
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.4);
    }

    .led-ring.on .led-core {
      background: #00ff88;
      box-shadow: 0 0 20px #00ff88;
      animation: blink 0.4s infinite alternate;
    }

    .led-ring.off {
      border-color: #ff3366;
      box-shadow: 0 0 15px rgba(255, 51, 102, 0.2);
    }

    .led-ring.off .led-core {
      background: #ff3366;
    }

    @keyframes blink {
      0% { opacity: 0.2; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    .status-text {
      font-size: 1.1rem;
      font-weight: 700;
      color: #94a3b8;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-on {
      background: linear-gradient(135deg, #00ff88, #00b862);
      color: #022c16;
      box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
    }

    .btn-on:hover {
      transform: translateY(-2px);
    }

    .btn-off {
      background: linear-gradient(135deg, #ff3366, #c71542);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(255, 51, 102, 0.3);
    }

    .btn-off:hover {
      transform: translateY(-2px);
    }

    .btn-logout {
      background: transparent;
      color: #64748b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px;
      font-size: 0.8rem;
      margin-top: 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-logout:hover {
      color: #ff3366;
      border-color: #ff3366;
    }

    .hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- POPUP DE LOGIN -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-card">
      <h2>Acesso Restrito</h2>
      <p>Digite a senha para desbloquear os controles</p>
      <input type="password" id="password-input" class="input-field" placeholder="Digite a senha">
      <button class="btn btn-on" onclick="checkPassword()">ENTRAR</button>
    </div>
  </div>

  <!-- CONTAINER PRINCIPAL -->
  <div class="container">
    <header>
      <h1>ESP32</h1>
      <p>Painel de Controle Protegido</p>
    </header>

    <div class="status-card">
      <div id="led-ring" class="led-ring">
        <div class="led-core"></div>
      </div>
      <div id="status-text" class="status-text">Carregando...</div>
    </div>

    <div class="btn-group">
      <button class="btn btn-on" onclick="setLedStatus(1)">LIGAR (PISCAR)</button>
      <button class="btn btn-off" onclick="setLedStatus(0)">DESLIGAR</button>
    </div>

    <button class="btn-logout" onclick="logout()">Sair / Bloquear</button>
  </div>

  <script>
    // Configurações
    const SENHA_MESTRA = "1234"; // <-- ALTERE SUA SENHA AQUI
    const DATABASE_URL = "https://esp32-11d28-default-rtdb.firebaseio.com/";
    const DATABASE_SECRET = "pXBRUOmqlAZFr6rXlWJMKK7QtXd5m7LR2QbH1BOH";

    // Lógica de Autenticação
    function checkPassword() {
      const input = document.getElementById("password-input").value;
      if (input === SENHA_MESTRA) {
        sessionStorage.setItem("authenticated", "true");
        document.getElementById("login-overlay").classList.add("hidden");
        document.getElementById("password-input").value = "";
      } else {
        alert("Senha incorreta!");
      }
    }

    function logout() {
      sessionStorage.removeItem("authenticated");
      document.getElementById("login-overlay").classList.remove("hidden");
    }

    // Função para interagir com o Firebase
    async function setLedStatus(value) {
      if (sessionStorage.getItem("authenticated") !== "true") {
        alert("Acesso negado. Faça login primeiro.");
        return;
      }

      const url = `${DATABASE_URL}led_status.json?auth=${DATABASE_SECRET}`;
      try {
        const response = await fetch(url, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(value)
        });
        if (response.ok) {
          updateUI(value);
        } else {
          alert("Erro na conexão com o Firebase.");
        }
      } catch (error) {
        alert("Erro ao enviar dados.");
      }
    }

    function updateUI(status) {
      const statusText = document.getElementById("status-text");
      const ledRing = document.getElementById("led-ring");

      if (status === 1) {
        statusText.innerText = "LIGADO (1)";
        statusText.style.color = "#00ff88";
        ledRing.className = "led-ring on";
      } else {
        statusText.innerText = "DESLIGADO (0)";
        statusText.style.color = "#ff3366";
        ledRing.className = "led-ring off";
      }
    }

    async function fetchCurrentStatus() {
      const url = `${DATABASE_URL}led_status.json?auth=${DATABASE_SECRET}`;
      try {
        const response = await fetch(url);
        if (response.ok) {
          const data = await response.json();
          updateUI(data);
        }
      } catch (error) {
        console.error("Erro ao carregar estado inicial:", error);
      }
    }

    // Inicialização
    document.addEventListener("DOMContentLoaded", () => {
      if (sessionStorage.getItem("authenticated") === "true") {
        document.getElementById("login-overlay").classList.add("hidden");
      }
      fetchCurrentStatus();
    });
  </script>

</body>
</html>
